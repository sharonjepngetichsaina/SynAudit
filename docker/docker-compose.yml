name: synaudit

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: synaudit-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: synaudit-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in adult-real adult-synthetic credit-default-real credit-default-synthetic; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1 \
            --config retention.ms=604800000
          echo "ready: $$topic"
        done
        echo "--- topics ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: synaudit-kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: synaudit
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: synaudit-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: synaudit123
      DOCKER_INFLUXDB_INIT_ORG: synaudit
      DOCKER_INFLUXDB_INIT_BUCKET: synaudit
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: synaudit-dev-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    container_name: synaudit-dashboard
    ports:
      - "8501:8501"
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: synaudit-dev-token
      INFLUX_ORG: synaudit
      INFLUX_BUCKET: synaudit
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  quality-adult:
    build:
      context: ..
      dockerfile: quality/Dockerfile
    container_name: synaudit-quality-adult
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    environment:
      DATASET: adult
      KAFKA_BOOTSTRAP: kafka:9092
      QUALITY_WINDOW: "500"
      QUALITY_STEP: "100"
      QUALITY_SDMETRICS_EVERY: "5"
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: synaudit-dev-token
      INFLUX_ORG: synaudit
      INFLUX_BUCKET: synaudit
    volumes:
      - ../results:/app/results
    restart: unless-stopped

  quality-credit-default:
    build:
      context: ..
      dockerfile: quality/Dockerfile
    container_name: synaudit-quality-credit-default
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    environment:
      DATASET: credit-default
      KAFKA_BOOTSTRAP: kafka:9092
      QUALITY_WINDOW: "500"
      QUALITY_STEP: "100"
      QUALITY_SDMETRICS_EVERY: "10"
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: synaudit-dev-token
      INFLUX_ORG: synaudit
      INFLUX_BUCKET: synaudit
    volumes:
      - ../results:/app/results
    restart: unless-stopped

volumes:
  kafka-data:
  influxdb-data: